<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoodOS — experience orchestration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sand:      #F5F0E8;
    --sand-mid:  #EDE6D6;
    --sand-deep: #D6CAB2;
    --amber:     #C4883A;
    --amber-lt:  #F0D9B0;
    --amber-dk:  #7A4F18;
    --terr:      #A0522D;
    --terr-lt:   #E8D0BC;
    --bark:      #3D2B1A;
    --bark-mid:  #6B4C30;
    --stone:     #8A7E6E;
    --stone-lt:  #C8BFB0;
    --cream:     #FBF7F0;
    --text-h:    #2A1A0A;
    --text-b:    #3D2B1A;
    --text-s:    #6B5840;
    --text-m:    #9A8A78;
    --sage:      #79906B;
    --r-sm:      6px;
    --r-md:      12px;
    --r-lg:      20px;
  }

  body {
    font-family: 'DM Sans', system-ui, sans-serif;
    background: var(--sand);
    color: var(--text-b);
    min-height: 100vh;
    line-height: 1.6;
  }

  #app { max-width: 860px; margin: 0 auto; padding: 0 24px 72px; }

  /* NAV */
  .nav {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 12px;
    padding: 18px 0;
    border-bottom: 1px solid var(--sand-deep);
    margin-bottom: 28px;
  }
  .nav-brand { display: flex; align-items: center; gap: 10px; }
  .nav-logo {
    width: 34px; height: 34px;
    background: var(--bark);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .nav-logo svg { width: 17px; height: 17px; fill: var(--amber-lt); }
  .nav-title { font-family: 'DM Serif Display', serif; font-size: 19px; color: var(--text-h); }
  .nav-sub { font-size: 11px; color: var(--text-m); letter-spacing: 0.04em; }
  .nav-right { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

  .chip {
    font-size: 11px; padding: 4px 10px;
    border: 1px solid var(--sand-deep);
    border-radius: 20px;
    color: var(--text-s);
    background: var(--sand);
    white-space: nowrap;
  }
  .chip.on { background: var(--amber-lt); border-color: var(--amber); color: var(--amber-dk); }
  .btn-connect {
    font-size: 12px; font-weight: 500; padding: 6px 14px;
    border: 1px solid var(--amber); border-radius: var(--r-sm);
    background: transparent; color: var(--amber-dk);
    text-decoration: none; transition: background 0.15s;
  }
  .btn-connect:hover { background: var(--amber-lt); }

  /* LOCATION BAR */
  .loc-bar {
    display: flex; align-items: center; gap: 9px;
    width: fit-content; max-width: 100%;
    padding: 8px 14px;
    background: var(--cream);
    border: 1px solid var(--sand-deep);
    border-radius: var(--r-sm);
    font-size: 12px; color: var(--text-m);
    margin: 26px 0 34px;
  }
  .loc-bar span:last-child { word-break: break-word; }
  .loc-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--amber); flex-shrink: 0;
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

  /* INPUT */
  .input-label {
    font-family: 'DM Serif Display', serif; font-style: italic;
    font-size: 22px; color: var(--text-h); margin-bottom: 14px;
  }
  .input-card { background: var(--cream); border: 1px solid var(--sand-deep); border-radius: var(--r-md); padding: 18px; }
  .input-card textarea {
    width: 100%; border: 0; outline: 0; background: transparent;
    font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--text-b);
    line-height: 1.7; resize: none; min-height: 120px;
  }
  .input-card textarea::placeholder { color: var(--text-m); }
  .input-footer {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    border-top: 1px solid var(--sand-mid); padding-top: 14px; margin-top: 8px;
  }
  .fld, .sel {
    font: 400 12px 'DM Sans', sans-serif; padding: 8px 12px;
    border: 1px solid var(--sand-deep); border-radius: var(--r-sm);
    background: var(--sand); color: var(--text-s); outline: 0;
  }
  .fld { flex: 1 1 160px; min-width: 140px; }
  .fld:focus { border-color: var(--amber); }
  .btn-send {
    margin-left: auto; font: 500 13px 'DM Sans', sans-serif;
    padding: 8px 22px; border: 0; border-radius: var(--r-sm);
    background: var(--bark); color: var(--amber-lt); cursor: pointer; transition: background 0.15s;
  }
  .btn-send:hover { background: var(--bark-mid); }
  .input-hint { font-size: 11px; color: var(--text-m); margin-top: 10px; line-height: 1.5; }

  /* MOOD ARC */
  .mood-arc { margin: 6px 0 44px; }
  .arc-ends { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .arc-end { font-family: 'DM Serif Display', serif; font-style: italic; font-size: 14px; }
  .arc-end.current { color: var(--terr); }
  .arc-end.desired { color: var(--amber-dk); }
  .arc-track { position: relative; height: 108px; margin-top: 6px; }
  .arc-rail { position: absolute; left: 0; right: 0; top: 50px; height: 5px; border-radius: 3px; background: var(--sand-deep); }
  .arc-fill { position: absolute; left: 0; top: 50px; height: 5px; border-radius: 3px; background: var(--amber); }
  .milestone { position: absolute; top: 53px; transform: translateX(-50%); }
  .m-dot {
    display: block; width: 16px; height: 16px; border-radius: 50%;
    background: var(--amber); border: 3px solid var(--sand); margin-top: -8px;
  }
  .m-label {
    position: absolute; left: 50%; transform: translateX(-50%);
    white-space: nowrap; font-size: 11px; color: var(--text-s);
  }
  .m-label.above { top: -40px; }
  .m-label.below { top: 18px; }

  /* BUNDLE HEADER */
  .bundle-head { margin-bottom: 26px; }
  .eyebrow {
    font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--amber); font-weight: 500; margin-bottom: 6px;
  }
  .bundle-title { font-family: 'DM Serif Display', serif; font-size: 30px; font-weight: 400; color: var(--text-h); margin-bottom: 10px; }
  .bundle-desc { font-size: 13px; color: var(--text-s); line-height: 1.65; max-width: 640px; }

  /* META GRID */
  .meta-grid {
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 1px;
    background: var(--sand-deep); border: 1px solid var(--sand-deep);
    border-radius: var(--r-md); overflow: hidden; margin-bottom: 38px;
  }
  .meta-cell { background: var(--cream); padding: 14px 16px; min-width: 0; }
  .meta-cell:last-child { background: var(--sand); }
  .meta-label { font-size: 10px; color: var(--text-m); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 4px; }
  .meta-value { font-size: 14px; font-weight: 500; color: var(--text-h); word-break: break-word; }
  .meta-value.mood { color: var(--terr); }
  .meta-value.desired { color: var(--amber-dk); }
  .meta-value.place { font-size: 12px; line-height: 1.4; }

  /* TIMELINE */
  .timeline { position: relative; margin-bottom: 8px; }
  .timeline::before {
    content: ''; position: absolute; left: 22px; top: 14px; bottom: 14px;
    width: 1px; background: var(--sand-deep);
  }
  .t-item { display: flex; gap: 20px; margin-bottom: 8px; position: relative; }
  .t-node {
    flex-shrink: 0; width: 44px; height: 44px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    position: relative; z-index: 1;
    border: 2px solid var(--sand-deep); background: var(--cream);
  }
  .t-node.activity { background: var(--bark); color: var(--amber-lt); border-color: var(--bark); }
  .t-node.activity .node-num { font-family: 'DM Serif Display', serif; font-size: 16px; }
  .t-node.travel { width: 38px; height: 38px; background: var(--sand-mid); color: var(--stone); border-color: var(--sand-deep); margin-top: 3px; }
  .t-node.travel svg { flex-shrink: 0; }
  .t-body { flex: 1; padding-bottom: 28px; min-width: 0; }
  .t-card { background: var(--cream); border: 1px solid var(--sand-deep); border-radius: var(--r-md); padding: 16px 18px; }
  .t-card.travel { background: var(--sand); border-style: dashed; padding: 11px 15px; }
  .t-card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
  .t-title { font-family: 'DM Serif Display', serif; font-size: 17px; color: var(--text-h); word-break: break-word; }
  .t-meta { display: flex; gap: 8px; flex-wrap: wrap; font-size: 11px; color: var(--text-m); margin-top: 3px; }
  .t-meta span + span::before { content: '·'; color: var(--sand-deep); }
  .badge {
    font-size: 10px; letter-spacing: 0.06em; text-transform: lowercase;
    padding: 3px 9px; border-radius: 20px; background: var(--sand-mid);
    color: var(--stone); font-weight: 500; white-space: nowrap; flex-shrink: 0;
  }
  .badge.walk { background: var(--terr-lt); color: var(--terr); }
  .badge.café { background: var(--amber-lt); color: var(--amber-dk); }
  .badge.movie { background: var(--sand-mid); color: var(--bark-mid); }
  .badge.music { background: #E8E0F0; color: #5A3A7A; }
  .badge.restaurant, .badge.food { background: var(--terr-lt); color: var(--terr); }
  .t-travel-title { font-size: 12px; font-weight: 500; color: var(--text-s); margin-bottom: 2px; }
  .t-reason { font-size: 13px; color: var(--text-s); line-height: 1.55; }
  .warn { font-size: 11px; color: var(--terr); background: var(--terr-lt); border-radius: var(--r-sm); padding: 8px 10px; margin-top: 10px; line-height: 1.5; }

  /* PLAYLIST */
  .pl-block { margin-top: 12px; border-top: 1px solid var(--sand-mid); padding-top: 12px; }
  .pl-list { list-style: none; margin: 0 0 12px; }
  .pl-track { display: flex; align-items: baseline; gap: 8px; font-size: 12px; color: var(--text-s); padding: 5px 0; }
  .pl-track + .pl-track { border-top: 1px dashed var(--sand-mid); }
  .pl-play { width: 11px; height: 11px; flex-shrink: 0; fill: var(--amber); transform: translateY(1px); }
  .pl-title { font-weight: 500; }
  .pl-dash { color: var(--stone-lt); }
  .pl-artist { color: var(--text-m); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btn-confirm {
    font: 500 12px 'DM Sans', sans-serif; padding: 8px 16px;
    border: 1px solid var(--amber); border-radius: var(--r-sm);
    background: transparent; color: var(--amber-dk); cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .btn-confirm:hover { background: var(--amber-lt); }
  .btn-confirm.created { background: var(--sage); border-color: var(--sage); color: var(--cream); }

  /* TOTAL BAR */
  .total-bar {
    display: flex; justify-content: space-between; align-items: center;
    gap: 16px; flex-wrap: wrap;
    background: var(--bark); border-radius: var(--r-md);
    padding: 16px 20px; margin: 34px 0 28px; color: var(--amber-lt);
  }
  .total-label { font-size: 12px; color: var(--stone-lt); }
  .total-num { font-family: 'DM Serif Display', serif; font-size: 22px; }
  .total-ask { font-size: 13px; color: var(--stone-lt); }

  /* TOOLS */
  .tools { background: var(--cream); border: 1px solid var(--sand-deep); border-radius: var(--r-md); overflow: hidden; margin-bottom: 30px; }
  .tools-head {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 14px 18px; background: transparent; border: 0; border-bottom: 1px solid var(--sand-deep);
    cursor: pointer; font: 500 12px 'DM Sans', sans-serif; color: var(--text-s); text-align: left;
  }
  .tools-head svg { color: var(--stone); flex-shrink: 0; }
  .tools-head .tools-label { flex: 1; }
  .chev { color: var(--stone); font-size: 14px; transition: transform 0.2s; }
  .tools.open .chev { transform: rotate(180deg); }
  .tools-table { width: 100%; border-collapse: collapse; }
  .tools-table tr { border-bottom: 1px solid var(--sand-mid); }
  .tools-table tr:last-child { border-bottom: 0; }
  .tools-table tr.alt { background: var(--sand); }
  .tools-table td { padding: 10px 18px; font-size: 12px; }
  .tools-table td:first-child { color: var(--text-s); font-weight: 500; white-space: nowrap; }
  .tools-table td:last-child { color: var(--text-m); text-align: right; }
  .tools-table code { font-family: ui-monospace, Consolas, monospace; font-size: 11px; color: var(--text-m); }

  /* ACTIONS */
  .action-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn-action { font: 500 12px 'DM Sans', sans-serif; padding: 10px 18px; border-radius: var(--r-sm); cursor: pointer; transition: background 0.15s; }
  .btn-action.primary { background: var(--amber); color: #FFF; border: 1px solid var(--amber); }
  .btn-action.primary:hover { background: var(--amber-dk); }
  .btn-action.ghost { background: transparent; color: var(--text-s); border: 1px solid var(--sand-deep); }
  .btn-action.ghost:hover { background: var(--sand-mid); }

  /* RESPONSIVE */
  @media (max-width: 900px) { .meta-grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 700px) {
    #app { padding: 0 16px 56px; }
    .nav { padding: 14px 0; }
    .bundle-title { font-size: 25px; }
    .timeline::before { left: 16px; }
    .t-item { gap: 13px; }
    .t-node { width: 36px; height: 36px; }
    .t-node.activity .node-num { font-size: 14px; }
    .t-node.travel { width: 32px; height: 32px; }
    .t-card { padding: 14px; }
    .t-body { padding-bottom: 22px; }
    .btn-send { width: 100%; margin-left: 0; }
    .tools-table td { padding: 9px 14px; }
  }
  @media (max-width: 460px) {
    .meta-grid { grid-template-columns: repeat(2, 1fr); }
    .nav-sub { display: none; }
    .tools-table { display: block; overflow-x: auto; white-space: nowrap; }
    .action-row .btn-action { flex: 1 1 100%; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
const PLAN = {
  user: {
    mood_current: "stressed",
    mood_desired: "happy & relaxed",
    budget: "₹1200",
    time: "5 hours",
    social: "solo",
    weather: "cloudy 31.7°",
    place: "Tragad, Ahmedabad, Gujarat",
    coordinates: "23.1259, 72.5406",
    gps_accuracy: "69m"
  },
  narrative: "This evening starts short of breath and ends softly — a low-effort walk first, then an unhurried café, a warm movie, and a quiet playlist to carry the calm home. It stays near ₹1200, fits about 5 hours, and avoids anything crowded or intense, so the mood can change without being pushed.",
  api_status: [
    { label: "Groq", on: true },
    { label: "Gemini", on: true },
    { label: "Mem0 cloud", on: false },
    { label: "Spotify", on: true }
  ],
  steps: [
    {
      type: "activity",
      number: 1,
      badge: "walk",
      title: "20-min walk near Sabarmati Riverfront",
      duration: "20 min",
      cost: "₹0",
      cost_type: "fixed",
      reason: "Open air and gentle movement reset a stressed mind faster than any stimulant — low effort, free, and right nearby.",
      warning: null
    },
    {
      type: "travel",
      destination: "Scoop N Munch",
      duration: "6 min",
      distance: "1.5 km",
      cost: "₹0"
    },
    {
      type: "activity",
      number: 3,
      badge: "café",
      title: "Scoop N Munch",
      duration: "75 min",
      cost: "₹250",
      cost_type: "budget",
      reason: "Quiet, uncrowded, unhurried — a space to decompress over something warm without noise pressing in on you.",
      warning: null
    },
    {
      type: "travel",
      destination: "The Gyan Café",
      duration: "6 min",
      distance: "3.7 km",
      cost: "₹0"
    },
    {
      type: "activity",
      number: 5,
      badge: "place",
      title: "The Gyan Café",
      duration: "29 min",
      cost: "₹250",
      cost_type: "budget",
      reason: "A quieter, wind-down stop that keeps the evening gentle before the film settles you further.",
      warning: null
    },
    {
      type: "travel",
      destination: "The Lunchbox",
      duration: "6 min",
      distance: "2.4 km",
      cost: "₹0"
    },
    {
      type: "activity",
      number: 7,
      badge: "movie",
      title: "The Lunchbox",
      duration: "104 min",
      cost: "₹220",
      cost_type: "fixed",
      reason: "Emotionally gentle and character-driven — the kind of film that rewards attention rather than demanding it.",
      warning: "Genre and tone unverified from listing. Treat runtime as an estimate — confirm the showtime before heading out."
    },
    {
      type: "activity",
      number: 8,
      badge: "music",
      title: "Arz Kiya Hai — Anuv Jain",
      duration: "60 min",
      cost: "₹0",
      cost_type: "fixed",
      reason: "Calming playlist to bring the evening down gently.",
      warning: null,
      playlist: [
        { title: "Arz Kiya Hai Coke Studio Bharat", artist: "Anuv Jain" },
        { title: "Iktara", artist: "Amit Trivedi, Kavita Seth & Amitabh Bhattacharya" },
        { title: "Wo Noor", artist: "AP Dhillon" },
        { title: "Tera Ban Jaunga", artist: "Akhil Sachdeva & Tulsi Kumar" },
        { title: "Tum Ho", artist: "Mohit Chauhan & Suzanne D'Mello" }
      ]
    }
  ],
  mood_arc: [
    { label: "Walk", position: 0.1 },
    { label: "Café", position: 0.35 },
    { label: "Place", position: 0.55 },
    { label: "Movie", position: 0.75 },
    { label: "Music", position: 0.95 }
  ],
  summary: {
    spend: "₹720",
    time_total: "306 min",
    time_asked: "~300 min",
    budget_asked: "₹1200"
  },
  tools: [
    { category: "Weather", fn: "get_weather", source: "Open-Meteo (live)" },
    { category: "Cafés / walk", fn: "find_nearby_places", source: "Overpass/OSM (live)" },
    { category: "Restaurants", fn: "search_restaurants", source: "Overpass/OSM (live)" },
    { category: "Cinemas", fn: "find_nearby_cinemas", source: "Overpass/OSM (live)" },
    { category: "Movies", fn: "search_movies", source: "TMDB · runtime marked estimate" },
    { category: "Music", fn: "search_music", source: "iTunes / Spotify (live)" },
    { category: "Books", fn: "search_books", source: "Book search" },
    { category: "Knowledge", fn: "retrieve_knowledge", source: "RAG / web knowledge" },
    { category: "Your profile", fn: "get_user_profile", source: "Mem0" }
  ]
};

(function () {
  const app = document.getElementById("app");

  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));

  const pct = (p) => ((Number(p) || 0) * 100).toFixed(1) + "%";

  const chipHTML = (c) => `<span class="chip${c.on ? " on" : ""}">${esc(c.label)}</span>`;

  function navHTML() {
    let chips = (PLAN.api_status || []).map(chipHTML);
    const spot = (PLAN.api_status || []).find((c) => String(c.label).toLowerCase().includes("spotify"));
    if (spot) {
      const spotChip = chips.findIndex((c, i) => i === (PLAN.api_status || []).indexOf(spot) && (PLAN.api_status || [])[i] === spot);
      const spotHTML = chipHTML(spot);
      chips = (PLAN.api_status || []).filter((c) => c !== spot).map(chipHTML);
      chips.push(spotHTML);
    }
    const connect = spot
      ? '<a class="btn-connect" href="/spotify/login">Connect Spotify</a>'
      : "";
    return `
      <nav class="nav">
        <div class="nav-brand">
          <div class="nav-logo">
            <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="3.5"/><path d="M8 1.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zm0-1.5a8 8 0 1 1 0 16A8 8 0 0 1 8 0z" opacity=".4"/></svg>
          </div>
          <div>
            <div class="nav-title">MoodOS</div>
            <div class="nav-sub">context-aware experience orchestration</div>
          </div>
        </div>
        <div class="nav-right">${chips.join("")}${connect}</div>
      </nav>`;
  }

  function locationHTML() {
    const u = PLAN.user || {};
    return `
      <div class="loc-bar">
        <span class="loc-dot"></span>
        <span>Live location ${esc(u.coordinates)} · ${esc(u.gps_accuracy)}</span>
      </div>`;
  }

  function inputHTML() {
    return `
      <section class="input-section">
        <div class="input-label">Ask MoodOS — a question or an evening to plan</div>
        <div class="input-card">
          <textarea placeholder="I had a really stressful day and don't want to stay at home tonight. I'm going alone, have ₹1200, and around 5 hours. I want the evening to gradually take me from stressed to happy and relaxed."></textarea>
          <div class="input-footer">
            <input class="fld" type="text" placeholder="Your city / area (optional) — e.g. Mumbai, Bandra">
            <select class="sel">
              <option value="">workflow (optional)</option>
              <option>solo evening</option>
              <option>date night</option>
              <option>group outing</option>
            </select>
            <button class="btn-send" type="button">Send</button>
          </div>
        </div>
        <div class="input-hint">Questions like “where am I?” or “what’s the weather?” get a short reply. Mood + budget + time still builds a plan with distances.</div>
      </section>`;
  }

  function arcHTML() {
    const u = PLAN.user || {};
    const arc = PLAN.mood_arc || [];
    const last = arc.length ? Number(arc[arc.length - 1].position) || 0 : 0;
    const dots = arc.map((m, i) => `
      <div class="milestone" style="left:${pct(m.position)}">
        <span class="m-dot"></span>
        <span class="m-label ${i % 2 ? "below" : "above"}">${esc(m.label)}</span>
      </div>`).join("");
    return `
      <section class="mood-arc" aria-label="Mood arc">
        <div class="arc-ends">
          <span class="arc-end current">${esc(u.mood_current)}</span>
          <span class="arc-end desired">${esc(u.mood_desired)}</span>
        </div>
        <div class="arc-track">
          <div class="arc-rail"></div>
          <div class="arc-fill" style="width:${pct(last)}"></div>
          ${dots}
        </div>
      </section>`;
  }

  function bundleHTML() {
    return `
      <header class="bundle-head">
        <div class="eyebrow">Experience plan ready</div>
        <h1 class="bundle-title">Your evening, curated</h1>
        <p class="bundle-desc">${esc(PLAN.narrative)}</p>
      </header>`;
  }

  function metaHTML() {
    const u = PLAN.user || {};
    const cells = [
      ["Mood", u.mood_current, "mood"],
      ["Desired", u.mood_desired, "desired"],
      ["Budget", u.budget, ""],
      ["Time", u.time, ""],
      ["Social", u.social, ""],
      ["Weather · Place", `${u.weather ? u.weather + " · " : ""}${u.place}`, "place"]
    ];
    return `
      <div class="meta-grid">
        ${cells.map(([lab, val, cls]) => `
          <div class="meta-cell">
            <div class="meta-label">${lab}</div>
            <div class="meta-value ${cls}">${esc(val)}</div>
          </div>`).join("")}
      </div>`;
  }

  const playIcon = () => '<svg class="pl-play" viewBox="0 0 16 16" fill="currentColor"><path d="M5 3v10l8-5z"/></svg>';

  function playoffHTML(t) {
    return `
      <li class="pl-track">
        ${playIcon()}
        <span class="pl-title">${esc(t.title)}</span>
        <span class="pl-dash">—</span>
        <span class="pl-artist">${esc(t.artist)}</span>
      </li>`;
  }

  function activityCardHTML(s, idx) {
    const cost = s.cost_type === "estimate" ? "est. " + s.cost : s.cost;
    const warn = s.warning ? `<div class="warn">${esc(s.warning)}</div>` : "";
    const pl = (s.playlist && s.playlist.length)
      ? `<div class="pl-block">
           <ul class="pl-list">${s.playlist.map(playoffHTML).join("")}</ul>
           <button type="button" class="btn-confirm" data-plow="${idx}">Confirm and create playlist</button>
         </div>`
      : "";
    return `
      <div class="t-item">
        <div class="t-node activity"><span class="node-num">${esc(s.number)}</span></div>
        <div class="t-body">
          <div class="t-card">
            <div class="t-card-head">
              <div>
                <div class="t-title">${esc(s.title)}</div>
                <div class="t-meta"><span>${esc(s.duration)}</span><span>${esc(cost)}</span></div>
              </div>
              <span class="badge ${esc(s.badge)}">${esc(s.badge)}</span>
            </div>
            <p class="t-reason">${esc(s.reason)}</p>
            ${warn}
            ${pl}
          </div>
        </div>
      </div>`;
  }

  function travelCardHTML(s) {
    return `
      <div class="t-item">
        <div class="t-node travel">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 8h10M9 5l4 3-4 3"/></svg>
        </div>
        <div class="t-body">
          <div class="t-card travel">
            <div class="t-travel-title">To ${esc(s.destination)}</div>
            <div class="t-meta"><span>${esc(s.duration)}</span><span>${esc(s.distance)}</span><span>${esc(s.cost)}</span></div>
          </div>
        </div>
      </div>`;
  }

  function timelineHTML() {
    const steps = (PLAN.steps || [])
      .map((s, i) => s.type === "travel" ? travelCardHTML(s) : activityCardHTML(s, i))
      .join("");
    return `<div class="timeline">${steps}</div>`;
  }

  function summaryHTML() {
    const s = PLAN.summary || {};
    return `
      <div class="total-bar">
        <div>
          <div class="total-label">Estimated spend</div>
          <div class="total-num">${esc(s.spend)}</div>
        </div>
        <div>
          <div class="total-label">Total time</div>
          <div class="total-num">${esc(s.time_total)}</div>
        </div>
        <div>
          <div class="total-label">You asked for</div>
          <div class="total-ask">${esc(s.time_asked)} · ${esc(s.budget_asked)}</div>
        </div>
      </div>`;
  }

  function toolsHTML() {
    const rows = (PLAN.tools || [])
      .map((t, i) => `
        <tr class="${i % 2 ? "alt" : ""}">
          <td>${esc(t.category)}</td>
          <td><code>${esc(t.fn)}</code></td>
          <td>${esc(t.source)}</td>
        </tr>`)
      .join("");
    return `
      <div class="tools" id="toolsWrap">
        <button type="button" class="tools-head" id="toolsToggle" aria-expanded="false">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="6"/><path d="M7 4v3.5l2 1.5"/></svg>
          <span class="tools-label">Which tools and data sources were used?</span>
          <span class="chev">⌃</span>
        </button>
        <div class="tools-body" id="toolsBody" hidden>
          <table class="tools-table"><tbody>${rows}</tbody></table>
        </div>
      </div>`;
  }

  function actionsHTML() {
    return `
      <div class="action-row">
        <button class="btn-action primary" type="button">That was perfect</button>
        <button class="btn-action ghost" type="button">Prepare movie booking</button>
        <button class="btn-action ghost" type="button">Create Spotify playlist</button>
        <button class="btn-action ghost" type="button">Find restaurants</button>
      </div>`;
  }

  function render() {
    app.innerHTML = [
      navHTML(),
      locationHTML(),
      inputHTML(),
      arcHTML(),
      bundleHTML(),
      metaHTML(),
      timelineHTML(),
      summaryHTML(),
      toolsHTML(),
      actionsHTML()
    ].join("");
    bind();
  }

  function bind() {
    const toggle = document.getElementById("toolsToggle");
    const body = document.getElementById("toolsBody");
    if (toggle && body) {
      toggle.addEventListener("click", () => {
        const wasHidden = body.hidden;
        body.hidden = !wasHidden;
        toggle.setAttribute("aria-expanded", String(wasHidden));
        document.getElementById("toolsWrap").classList.toggle("open", wasHidden);
      });
    }
    document.querySelectorAll(".btn-confirm").forEach((b) => {
      b.addEventListener("click", () => {
        b.textContent = "Playlist created";
        b.classList.add("created");
      });
    });
  }

  render();
})();
</script>
</body>
</html>
